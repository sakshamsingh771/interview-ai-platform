<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrepRoom — AI Interview Coach</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Runs before React mounts so there's no flash of the wrong theme.
      // Defaults to PrepRoom's dark studio look unless the person opted into light.
      (function () {
        var stored = localStorage.getItem("theme");
        var theme = stored === "light" ? "light" : "dark";
        document.documentElement.classList.add(theme);
      })();
    </script>
  </head>
  <body class="bg-ink text-paper">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
